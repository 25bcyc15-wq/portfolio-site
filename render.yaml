services:
  - type: web
    name: arsha-portfolio
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements_fastapi.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      # Add your Supabase credentials here in Render dashboard
      # - key: SUPABASE_URL
      #   value: your_supabase_url
      # - key: SUPABASE_KEY
      #   value: your_supabase_anon_key
